name: Volley API Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SPORTSAPI_KEY: ${{ secrets.SPORTSAPI_KEY }}
    steps:
      - name: Inspect live volleyball response
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          key = os.environ.get("SPORTSAPI_KEY")
          if not key:
              raise SystemExit("SPORTSAPI_KEY missing")
          url = "https://api.sportsapi.app/v2/livescores?sport=volleyball"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + key, "Accept": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=20) as res:
                  print("HTTP", res.status)
                  for k,v in res.headers.items():
                      if "ratelimit" in k.lower():
                          print(k, v)
                  data = json.load(res)
          except urllib.error.HTTPError as e:
              raise SystemExit("HTTP " + str(e.code))
          def shape(x, depth=0):
              if depth > 5: return type(x).__name__
              if isinstance(x, dict): return {k:shape(v,depth+1) for k,v in x.items()}
              if isinstance(x, list): return {"count":len(x),"sample":shape(x[0],depth+1) if x else None}
              return type(x).__name__
          print(json.dumps(shape(data), ensure_ascii=True))
          PY
