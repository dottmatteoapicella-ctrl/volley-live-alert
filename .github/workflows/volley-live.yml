name: Volley Live Alert
on:
  workflow_dispatch:
    inputs:
      initialize:
        description: Initialize only on the first run, never after cache loss
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: volley-live-state
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPORTSAPI_KEY: ${{ secrets.SPORTSAPI_KEY }}
      MOVIODDS_API_KEY: ${{ secrets.MOVIODDS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VOLLEY_INITIALIZE: ${{ inputs.initialize && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - name: Restore encrypted state
        uses: actions/cache/restore@v4
        with:
          path: volley.enc
          key: volley-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            volley-state-v1-
      - name: Run offline tests
        run: python -m unittest discover -v
      - name: Run live monitor
        run: python volley_main.py
      - name: Save encrypted state
        if: always() && hashFiles('volley.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: volley.enc
          key: volley-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
